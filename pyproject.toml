[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.6,<0.14" ]

[project]
name = "mjpeg-streamer"
version = "2024.2.8"
description = "Simple, flexible and efficient MJPEG video streamer for Python"
readme = "README.md"
keywords = [
  "aiohttp",
  "asyncio",
  "computer-vision",
  "mjpeg",
  "multi-camera",
  "opencv",
  "server",
  "streamer",
  "streaming",
  "video",
  "webcam",
]
license = "AGPL-3.0-or-later"
license-files = [ "LICENSE" ]
authors = [ { name = "Ege Akman", email = "me@egeakman.dev" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: aiohttp",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "aiohttp>=3.11",
  "netifaces>=0.11",
  "numpy>=1.24",
  "opencv-python>=4.8.1.78",
]
urls.Homepage = "https://github.com/egeakman/mjpeg-streamer"
urls.Issues = "https://github.com/egeakman/mjpeg-streamer/issues"
urls.Releases = "https://github.com/egeakman/mjpeg-streamer/releases"
scripts.mjpeg-streamer = "mjpeg_streamer.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
extend-exclude = [ "examples" ]
lint.ignore = [
  "EM101",  # Exception must not use a string literal
  "EM102",  # Exception must not use an f-string literal
  "FBT001", # Boolean-typed positional argument in function definition
  "S104",   # Binding to all interfaces: intended when the user asks for it (RULE-018)
  "T201",   # `print` found | TODO: migrate to logging (Phase 3)
  "TID252", # Relative imports are banned | __init__.py
  "TRY003", # Avoid specifying long messages outside the exception class
]
lint.per-file-ignores."src/mjpeg_streamer/cli.py" = [
  "BLE001",  # blind `except Exception` in the legacy shutdown path; CLI rewritten in Phase 4
  "PLW0602", # `global bandwidth` without assignment; CLI rewritten in Phase 4
]

[tool.pyright]
venv = ".venv"
venvPath = "."
